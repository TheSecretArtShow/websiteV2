<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTSHOW | Collections</title>
  <style>
    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', sans-serif;
    }
    body {
      background: #111111;
      color: #ffffff;
    }
    /* Header Styles */
    .header {
      padding: 1.8rem 5%;
      border-bottom: 1px solid #3a3a3a;
      position: fixed;
      width: 100%;
      background: rgba(45, 45, 45, 0.97) !important;
      backdrop-filter: blur(8px);
      z-index: 100;
    }
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }
    .logo {
      width: 180px;
    }
    .nav-links {
      display: flex;
      gap: 2.8rem;
    }
    .nav-link {
      color: rgba(255, 255, 255, 0.9) !important;
      text-decoration: none;
      font-weight: 300;
      letter-spacing: 2.5px;
      font-size: 0.95rem;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 3px;
      transition: opacity 0.4s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0.5px;
      background: rgba(255, 255, 255, 0.9);
      transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .nav-link:hover::after {
      width: 100%;
    }
    .nav-link[href="collections.html"] {
      font-weight: 400;
    }
    .nav-link[href="collections.html"]::after {
      width: 100%;
    }
    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4rem;
      padding: 10rem 5% 5rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    .product-card {
      position: relative;
      overflow: hidden;
    }
    /* Landscape aspect ratio */
    .product-image {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      background: #fff;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .product-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.6s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .product-card:hover .product-overlay {
      opacity: 1;
    }
    .product-card:hover .product-image {
      transform: scale(1.03);
    }
    .sold-out {
      display: none;
    }
    /* Button and Video Styles */
    .view-details {
      position: relative; /* For positioning child video */
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 0.8rem 2rem;
      cursor: pointer;
      font-weight: 300;
      letter-spacing: 2px;
      transform: translateY(20px);
      transition: all 0.6s ease;
      overflow: hidden; /* Hide video overflow */
    }
    .product-card:hover .view-details {
      transform: translateY(0);
    }
    .view-details video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none; /* Allow button clicks to pass through */
      display: none;
    }
    .product-info {
      padding: 1.5rem 0;
      text-align: center;
    }
    .product-title {
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    .product-price {
      font-weight: 300;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="header-nav">
      <img src="TAS Logo Vector IC.svg" alt="TAS Logo" class="logo">
      <div class="nav-links">
        <a href="index.html" class="nav-link">HOME</a>
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="shop.html" class="nav-link">SHOP</a>
        <a href="inner-circle.html" class="nav-link">THE INNER CIRCLE</a>
        <a href="contact.html" class="nav-link">CONTACT</a>
        <a href="collections.html" class="nav-link">COLLECTIONS</a>
      </div>
    </nav>
  </header>

  <main class="products-grid">
    <!-- Bones Collection Card -->
    <div class="product-card" id="bones-collection-card">
      <div class="product-image">
        <div class="product-overlay">
          <button class="view-details" id="bones-button">
            VIEW COLLECTION
            <video id="bones-video" muted loop playsinline>
              <source src="20250318_1821_Bones Collection Unleashed_simple_compose_01jpnzth30f45v0xk3hrebx911.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </button>
        </div>
        <img src="images/bones collection.png" alt="BONES COLLECTION Image" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="product-info">
        <h2 class="product-title">BONES COLLECTION</h2>
      </div>
    </div>
    <!-- 27 Club Collection Card -->
    <div class="product-card" id="club-collection-card">
      <div class="product-image">
        <div class="product-overlay">
          <button class="view-details" id="club-button">
            VIEW COLLECTION
            <video id="club-video" muted loop playsinline>
              <source src="20250318_1851_Urban Streetwear Showcase_simple_compose_01jpp1hnyffcxa7qez04ka8jyn.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </button>
        </div>
        <img src="images/27 club collection.png" alt="27 CLUB COLLECTION Image" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="product-info">
        <h2 class="product-title">27 CLUB COLLECTION</h2>
      </div>
    </div>
    <!-- Abstract Collection Card -->
    <div class="product-card" id="abstract-collection-card">
      <div class="product-image">
        <div class="product-overlay">
          <button class="view-details" id="abstract-button">
            VIEW COLLECTION
            <video id="abstract-video" muted loop playsinline>
              <source src="20250318_1903_Abstract Fashion Street Style_simple_compose_01jpp28e59f1bszxdhd2ct3h6z.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </button>
        </div>
        <img src="images/abstract collection.png" alt="ABSTRACT COLLECTION Image" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="product-info">
        <h2 class="product-title">ABSTRACT COLLECTION</h2>
      </div>
    </div>
  </main>

  <script>
    // Bones Collection Video Hover
    const bonesButton = document.getElementById('bones-button');
    const bonesVideo = document.getElementById('bones-video');
    bonesButton.addEventListener('mouseenter', () => {
      bonesVideo.style.display = 'block';
      bonesVideo.play();
    });
    bonesButton.addEventListener('mouseleave', () => {
      bonesVideo.pause();
      bonesVideo.currentTime = 0;
      bonesVideo.style.display = 'none';
    });

    // 27 Club Collection Video Hover
    const clubButton = document.getElementById('club-button');
    const clubVideo = document.getElementById('club-video');
    clubButton.addEventListener('mouseenter', () => {
      clubVideo.style.display = 'block';
      clubVideo.play();
    });
    clubButton.addEventListener('mouseleave', () => {
      clubVideo.pause();
      clubVideo.currentTime = 0;
      clubVideo.style.display = 'none';
    });

    // Abstract Collection Video Hover
    const abstractButton = document.getElementById('abstract-button');
    const abstractVideo = document.getElementById('abstract-video');
    abstractButton.addEventListener('mouseenter', () => {
      abstractVideo.style.display = 'block';
      abstractVideo.play();
    });
    abstractButton.addEventListener('mouseleave', () => {
      abstractVideo.pause();
      abstractVideo.currentTime = 0;
      abstractVideo.style.display = 'none';
    });
  </script>
</body>
</html>
