<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTSHOW | Collections</title>
  <style>
    /* =============================
       Reset & Base Styles
    ============================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', sans-serif;
    }
    body {
      background: #111111;
      color: #ffffff;
    }

    /* =============================
       Header Styles
    ============================= */
    .header {
      padding: 1rem 5%;
      border-bottom: 1px solid #3a3a3a;
      position: fixed;
      width: 100%;
      background: rgba(45, 45, 45, 0.97) !important;
      backdrop-filter: blur(8px);
      z-index: 100;
    }
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }
    .logo {
      width: 180px;
    }
    .nav-links {
      display: flex;
      gap: 2.8rem;
    }
    .nav-link {
      color: rgba(255, 255, 255, 0.9) !important;
      text-decoration: none;
      font-weight: 300;
      letter-spacing: 2.5px;
      font-size: 0.95rem;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 3px;
      transition: opacity 0.4s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0.5px;
      background: rgba(255, 255, 255, 0.9);
      transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .nav-link:hover::after {
      width: 100%;
    }
    .nav-link[href="collections.html"] {
      font-weight: 400;
    }
    .nav-link[href="collections.html"]::after {
      width: 100%;
    }

    /* =============================
       Product Grid
    ============================= */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4rem;
      padding: 10rem 5% 5rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    .product-card {
      position: relative;
      overflow: hidden;
    }
    /* Landscape aspect ratio */
    .product-image {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      background: #fff;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .product-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.6s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .product-card:hover .product-overlay {
      opacity: 1;
    }
    .product-card:hover .product-image {
      transform: scale(1.03);
    }
    .sold-out {
      display: none;
    }

    /* =============================
       Button & Video Styles
    ============================= */
    .view-details {
      position: relative;
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 0.8rem 2rem;
      cursor: pointer;
      font-weight: 300;
      letter-spacing: 2px;
      transform: translateY(20px);
      transition: all 0.6s ease;
      overflow: hidden;
    }
    .product-card:hover .view-details {
      transform: translateY(0);
    }
    .view-details video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: none;
    }
    .product-info {
      padding: 1.5rem 0;
      text-align: center;
    }
    .product-title {
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    /* =============================
       Full-Screen Overlay
       Starts transparent so user sees the page behind the expanding video.
    ============================= */
    #collection-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0); /* Start fully transparent */
      transition: background 0.5s ease; /* Fade to black */
      z-index: 200;
      display: none;
      overflow: hidden;
    }
    .overlay-video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .overlay-video-container video {
      position: absolute;
      object-fit: cover;
      object-position: center; /* center the video within the container */
      transition: all 0.8s ease-in-out;
      /*
        We'll expand the video to 100% + 15px in height,
        then clip the bottom 15px to "crop" it.
      */
    }
    .overlay-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s ease-in-out; /* Fade in/out of content */
    }
    .coming-soon {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 2px;
    }

    /* Minimalistic form container */
    .overlay-form {
      margin-top: 20px;
    }
    .overlay-form button {
      margin: 5px;
      padding: 0.8rem 1.2rem;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .overlay-form button:hover {
      transform: scale(1.05);
    }

    /* Smooth email field appearance */
    #notify-field {
      margin-top: 15px;
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #notify-field.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    #notify-field input {
      padding: 0.5rem;
      margin-right: 5px;
      border: none;
      border-radius: 4px;
    }
    #notify-field button {
      padding: 0.5rem 1rem;
      background: #fff;
      border: none;
      color: #000;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="header-nav">
      <img src="TAS Logo Vector IC.svg" alt="TAS Logo" class="logo">
      <div class="nav-links">
        <a href="index.html" class="nav-link">HOME</a>
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="shop.html" class="nav-link">SHOP</a>
        <a href="InnerCircle.html" class="nav-link">THE INNER CIRCLE</a>
        <a href="contact.html" class="nav-link">CONTACT</a>
        <a href="collections.html" class="nav-link">COLLECTIONS</a>
      </div>
    </nav>
  </header>

  <main class="products-grid">
    <!-- Bones Collection Card -->
    <div class="product-card" id="bones-collection-card">
      <div class="product-image">
        <div class="product-overlay">
          <button class="view-details" id="bones-button">
            VIEW COLLECTION
            <video id="bones-video" muted loop playsinline>
              <source src="20250318_1821_Bones Collection Unleashed_simple_compose_01jpnzth30f45v0xk3hrebx911.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </button>
        </div>
        <img src="images/bones collection.png" alt="BONES COLLECTION Image" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="product-info">
        <h2 class="product-title">BONES COLLECTION</h2>
      </div>
    </div>
    <!-- 27 Club Collection Card -->
    <div class="product-card" id="club-collection-card">
      <div class="product-image">
        <div class="product-overlay">
          <button class="view-details" id="club-button">
            VIEW COLLECTION
            <video id="club-video" muted loop playsinline>
              <source src="20250318_1851_Urban Streetwear Showcase_simple_compose_01jpp1hnyffcxa7qez04ka8jyn.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </button>
        </div>
        <img src="images/27 club collection.png" alt="27 CLUB COLLECTION Image" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="product-info">
        <h2 class="product-title">27 CLUB COLLECTION</h2>
      </div>
    </div>
    <!-- Abstract Collection Card -->
    <div class="product-card" id="abstract-collection-card">
      <div class="product-image">
        <div class="product-overlay">
          <button class="view-details" id="abstract-button">
            VIEW COLLECTION
            <video id="abstract-video" muted loop playsinline>
              <source src="20250318_1903_Abstract Fashion Street Style_simple_compose_01jpp28e5cevdrapzn4dxtnrdd.mp4">
              Your browser does not support the video tag.
            </video>
          </button>
        </div>
        <img src="images/abstract collection.png" alt="ABSTRACT COLLECTION Image" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="product-info">
        <h2 class="product-title">ABSTRACT COLLECTION</h2>
      </div>
    </div>
  </main>

  <!-- Full-Screen Overlay (transparent initially) -->
  <div id="collection-overlay">
    <div class="overlay-video-container"></div>
    <div class="overlay-content"></div>
  </div>

  <script>
    // Expand to full screen with bottom 15px cropped
    document.querySelectorAll('.view-details').forEach(button => {
      button.addEventListener('click', function(e) {
        e.preventDefault();

        const video = button.querySelector('video');
        const rect = video.getBoundingClientRect();

        // Clone the video element so we can animate it
        const clonedVideo = video.cloneNode(true);
        clonedVideo.style.position = 'absolute';
        clonedVideo.style.top = rect.top + 'px';
        clonedVideo.style.left = rect.left + 'px';
        clonedVideo.style.width = rect.width + 'px';
        clonedVideo.style.height = rect.height + 'px';
        clonedVideo.style.objectFit = 'cover';
        clonedVideo.style.objectPosition = 'center';

        // Overlay references
        const overlay = document.getElementById('collection-overlay');
        const videoContainer = overlay.querySelector('.overlay-video-container');
        const overlayContent = overlay.querySelector('.overlay-content');

        // Clear any previous content
        videoContainer.innerHTML = '';
        overlayContent.innerHTML = '';

        // Add the cloned video to the overlay
        videoContainer.appendChild(clonedVideo);

        // Show the overlay (still transparent)
        overlay.style.display = 'block';
        overlay.style.background = 'rgba(0,0,0,0)';

        // Force reflow so initial styles are applied
        void clonedVideo.offsetWidth;

        // Animate the video to full screen with bottom 15px cropped
        clonedVideo.play();
        clonedVideo.style.top = '0px';
        clonedVideo.style.left = '0px';
        clonedVideo.style.width = '100%';
        // Increase the height to 100% + 15px, then clip the bottom 15px
        clonedVideo.style.height = 'calc(100%)';
        clonedVideo.style.clipPath = 'inset(0px 0px 15px 0px)';

        // Fade the overlay background to black after a brief delay
        setTimeout(() => {
          overlay.style.background = 'rgba(0,0,0,1)';
        }, 100); // Adjust delay as desired

        // Once the video finishes expanding (~0.8s), fade in "COMING SOON"
        setTimeout(() => {
          overlayContent.innerHTML = '<div class="coming-soon">COMING SOON</div>';
          overlayContent.style.opacity = '1';

          // Keep "COMING SOON" for 1.5s
          setTimeout(() => {
            // Fade out "COMING SOON"
            overlayContent.style.opacity = '0';

            // After 0.5s (the fade-out duration), replace with minimalistic form
            setTimeout(() => {
              overlayContent.innerHTML = `
                <div class="overlay-form">
                  <button id="resume-button">RESUME BROWSING</button>
                  <button id="notify-button">LET ME KNOW WHEN IT DROPS</button>
                  <div id="notify-field">
                    <input type="email" placeholder="Enter your email" id="notify-email">
                    <button id="notify-submit">Submit</button>
                  </div>
                </div>`;
              // Fade in the new content
              overlayContent.style.opacity = '1';

              // Resume Browsing button
              document.getElementById('resume-button').addEventListener('click', () => {
                // Fade out the overlay content
                overlayContent.style.opacity = '0';
                // Fade overlay background back to transparent
                overlay.style.background = 'rgba(0,0,0,0)';

                // Remove the clip path & revert height so it can shrink properly
                clonedVideo.style.clipPath = '';
                clonedVideo.style.height = rect.height + 'px';

                // Animate cloned video back to original position
                clonedVideo.style.top = rect.top + 'px';
                clonedVideo.style.left = rect.left + 'px';
                clonedVideo.style.width = rect.width + 'px';

                // Once the video has shrunk back (~0.8s), hide the overlay
                setTimeout(() => {
                  overlay.style.display = 'none';
                }, 800);
              });

              // LET ME KNOW WHEN IT DROPS button
              document.getElementById('notify-button').addEventListener('click', () => {
                const notifyField = document.getElementById('notify-field');
                // Toggle the .active class for a smooth fade/slide in
                notifyField.classList.toggle('active');
              });

              // Handle Submit -> send email to Google Sheets
              document.getElementById('notify-submit').addEventListener('click', () => {
                const userEmail = document.getElementById('notify-email').value.trim();
                if (userEmail) {
                  fetch('https://art-show-signup-rh2gqoobqa-uw.a.run.app/submit-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // We'll store it under a "Collection" listType
                    body: JSON.stringify({ listType: 'Collection', email: userEmail })
                  })
                  .then(response => response.json())
                  .then(data => {
                    // Replace the entire notify field with a golden button
                    const notifyField = document.getElementById('notify-field');
                    notifyField.innerHTML = `
                      <button 
                        style="
                          background-color: #d4af37; 
                          color: #111; 
                          border:none; 
                          padding:0.8rem 1.2rem; 
                          border-radius:4px; 
                          cursor:pointer; 
                          text-transform:uppercase; 
                          letter-spacing:2px;
                        ">
                        WE'LL BE IN TOUCH
                      </button>
                    `;
                  })
                  .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');
                  });
                } else {
                  alert('Please enter a valid email address.');
                }
              });
            }, 500); // 0.5s fade-out for "COMING SOON"
          }, 1500); // 1.5s display time for "COMING SOON"
        }, 800);
      });
    });

    // =====================
    // Hover Video Behavior
    // =====================
    // Bones
    const bonesButton = document.getElementById('bones-button');
    const bonesVideo = document.getElementById('bones-video');
    bonesButton.addEventListener('mouseenter', () => {
      bonesVideo.style.display = 'block';
      bonesVideo.play();
    });
    bonesButton.addEventListener('mouseleave', () => {
      bonesVideo.pause();
      bonesVideo.currentTime = 0;
      bonesVideo.style.display = 'none';
    });

    // 27 Club
    const clubButton = document.getElementById('club-button');
    const clubVideo = document.getElementById('club-video');
    clubButton.addEventListener('mouseenter', () => {
      clubVideo.style.display = 'block';
      clubVideo.play();
    });
    clubButton.addEventListener('mouseleave', () => {
      clubVideo.pause();
      clubVideo.currentTime = 0;
      clubVideo.style.display = 'none';
    });

    // Abstract
    const abstractButton = document.getElementById('abstract-button');
    const abstractVideo = document.getElementById('abstract-video');
    abstractButton.addEventListener('mouseenter', () => {
      abstractVideo.style.display = 'block';
      abstractVideo.play();
    });
    abstractButton.addEventListener('mouseleave', () => {
      abstractVideo.pause();
      abstractVideo.currentTime = 0;
      abstractVideo.style.display = 'none';
    });
  </script>
</body>
</html>
