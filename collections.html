<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARTSHOW | Collections</title>
  <style>
    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', sans-serif;
    }
    body {
      background: #111111;
      color: #ffffff;
    }
    /* Header Styles */
    .header {
      padding: 1.8rem 5%;
      border-bottom: 1px solid #3a3a3a;
      position: fixed;
      width: 100%;
      background: rgba(45, 45, 45, 0.97) !important;
      backdrop-filter: blur(8px);
      z-index: 100;
    }
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }
    .logo {
      width: 180px;
    }
    .nav-links {
      display: flex;
      gap: 2.8rem;
    }
    .nav-link {
      color: rgba(255, 255, 255, 0.9) !important;
      text-decoration: none;
      font-weight: 300;
      letter-spacing: 2.5px;
      font-size: 0.95rem;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 3px;
      transition: opacity 0.4s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0.5px;
      background: rgba(255, 255, 255, 0.9);
      transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .nav-link:hover::after {
      width: 100%;
    }
    /* Mark collections page active (optional) */
    .nav-link[href="collections.html"] {
      font-weight: 400;
    }
    .nav-link[href="collections.html"]::after {
      width: 100%;
    }
    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4rem;
      padding: 10rem 5% 5rem;
      max-width: 1600px;
      margin: 0 auto;
    }
    .product-card {
      position: relative;
      overflow: hidden;
    }
    /* Use a landscape aspect ratio instead of portrait */
    .product-image {
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      background: #fff;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .product-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 0.6s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .product-card:hover .product-overlay {
      opacity: 1;
    }
    .product-card:hover .product-image {
      transform: scale(1.03);
    }
    /* Optionally remove the "sold-out" text for collections */
    .sold-out {
      display: none;
    }
    .view-details {
      background: transparent;
      border: 1px solid white;
      color: white;
      padding: 0.8rem 2rem;
      cursor: pointer;
      font-weight: 300;
      letter-spacing: 2px;
      transform: translateY(20px);
      transition: all 0.6s ease;
    }
    .product-card:hover .view-details {
      transform: translateY(0);
    }
    .product-info {
      padding: 1.5rem 0;
      text-align: center;
    }
    .product-title {
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    /* The product-price class remains in case you want to add more info later */
    .product-price {
      font-weight: 300;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header class="header">
    <nav class="header-nav">
      <img src="TAS Logo Vector IC.svg" alt="TAS Logo" class="logo">
      <div class="nav-links">
        <a href="index.html" class="nav-link">HOME</a>
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="shop.html" class="nav-link">SHOP</a>
        <a href="inner-circle.html" class="nav-link">THE INNER CIRCLE</a>
        <a href="contact.html" class="nav-link">CONTACT</a>
        <a href="collections.html" class="nav-link">COLLECTIONS</a>
      </div>
    </nav>
  </header>

  <main class="products-grid">
    <!-- Bones Collection Card -->
    <div class="product-card">
      <div class="product-image">
        <div class="product-overlay">
          <button class="view-details">VIEW COLLECTION</button>
        </div>
        <img src="images/bones collection.jpg" alt="BONES COLLECTION Image" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="product-info">
        <h2 class="product-title">BONES COLLECTION</h2>
      </div>
    </div>
    <!-- 27 Club Collection Card -->
    <div class="product-card">
      <div class="product-image">
        <div class="product-overlay">
          <button class="view-details">VIEW COLLECTION</button>
        </div>
        <img src="images/27 club collection.jpg" alt="27 CLUB COLLECTION Image" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="product-info">
        <h2 class="product-title">27 CLUB COLLECTION</h2>
      </div>
    </div>
    <!-- Abstract Collection Card -->
    <div class="product-card">
      <div class="product-image">
        <div class="product-overlay">
          <button class="view-details">VIEW COLLECTION</button>
        </div>
        <img src="images/abstract collection.jpg" alt="ABSTRACT COLLECTION Image" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div class="product-info">
        <h2 class="product-title">ABSTRACT COLLECTION</h2>
      </div>
    </div>
  </main>
</body>
</html>
