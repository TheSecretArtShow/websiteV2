<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Art Show - Contact Support</title>
  <!-- Google Fonts: Playfair Display for headings, Lato for body -->
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Embedded CSS -->
  <style>
    /* General Reset / Box Sizing */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body Styling */
    body {
      font-family: 'Lato', sans-serif;
      color: #fff;
      background-color: #000; /* Rich black background */
      overflow-x: hidden;
    }

    /* NAVIGATION BAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 3rem;
      background-color: rgba(0, 0, 0, 0.7); /* Slight transparency */
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #d4af37; /* gold accent */
      letter-spacing: 1px;
      cursor: default;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      text-decoration: none;
      color: #fff;
      font-weight: 300;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #d4af37; /* gold accent on hover */
    }

    /* HERO SECTION (Optional) */
    .hero-section {
      position: relative;
      width: 100%;
      height: 50vh; /* Adjust as needed */
      background: url('https://picsum.photos/1600/900?grayscale') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
    }

    .hero-title {
      position: relative;
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: #d4af37;
      text-align: center;
      letter-spacing: 2px;
      z-index: 1;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
    }

    /* CONTACT SECTION */
    .contact-container {
      max-width: 600px;
      margin: 3rem auto;
      padding: 0 1rem;
      text-align: center;
    }

    .contact-container h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      color: #d4af37;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .contact-form label {
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: #ccc;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      background-color: #111;
      border: 1px solid #333;
      border-radius: 4px;
      color: #fff;
      padding: 0.8rem;
      font-size: 0.95rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      font-family: inherit;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 5px rgba(212,175,55, 0.5);
    }

    .contact-form textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* SEND BUTTON */
    .send-btn {
      align-self: flex-start;
      background: #d4af37;
      border: none;
      color: #000;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.7rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .send-btn:hover {
      background: #c39b30;
      transform: translateY(-1px);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      padding: 2rem 0;
      background-color: #111;
      margin-top: 3rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .footer p {
      font-size: 0.9rem;
      color: #888;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 1rem;
      }
      .nav-links {
        flex-direction: column;
        gap: 1rem;
      }
      .hero-title {
        font-size: 2rem;
      }
      .contact-container {
        margin: 2rem auto;
      }
    }
  </style>
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-logo">The Art Show</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Shop</a></li>
      <li><a href="#">The Inner Circle</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero or Banner Section (Optional) -->
  <section class="hero-section">
    <div class="hero-overlay"></div>
    <h1 class="hero-title">Elevate Your Experience</h1>
  </section>

  <!-- Contact Support Section -->
  <section class="contact-container">
    <h2>Contact Support</h2>
    <form class="contact-form">
      <label for="email">Enter your email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="Enter your name" required />

      <label for="message">Your Message</label>
      <textarea id="message" placeholder="Enter your message" required></textarea>

      <button type="submit" class="send-btn">Send Message</button>
    </form>
  </section>

  <!-- Footer (Optional) -->
  <footer class="footer">
    <p>&copy; 2023 The Art Show. All rights reserved.</p>
  </footer>
</body>
</html>
