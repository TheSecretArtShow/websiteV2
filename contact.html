<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARTSHOW | Contact Support</title>
  <style>
    /* ----------------------------------------------------------------
       RESET & BASE STYLES
    ---------------------------------------------------------------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Helvetica Neue', sans-serif;
    }

    body {
      background: #111111; /* Dark background */
      color: #ffffff;      /* White text */
      overflow-x: hidden;  /* No horizontal scroll */
    }

    /* ----------------------------------------------------------------
       HEADER & NAV (Reused from shop.html)
    ---------------------------------------------------------------- */
    .header {
      padding: 1rem 5%;
      border-bottom: 1px solid #3a3a3a;
      position: fixed;
      width: 100%;
      background: rgba(45, 45, 45, 0.97) !important;
      backdrop-filter: blur(8px);
      z-index: 100;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo {
      width: 180px;
    }

    .nav-links {
      display: flex;
      gap: 2.8rem;
    }

    .nav-link {
      color: rgba(255, 255, 255, 0.9) !important;
      text-decoration: none;
      font-weight: 300;
      letter-spacing: 2.5px;
      font-size: 0.95rem;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 3px;
      transition: opacity 0.4s ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0.5px;
      background: rgba(255, 255, 255, 0.9);
      transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .nav-link[href="contact.html"] {
      font-weight: 400;
    }

    .nav-link[href="contact.html"]::after {
      width: 100%;
    }

    /* ----------------------------------------------------------------
       HERO SECTION
       Subtle gradient background with gold accent text for a luxury feel
    ---------------------------------------------------------------- */
    .hero {
      position: relative;
      min-height: 40vh; /* Enough space to feel 'heroic' */
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 5%;
      margin-top: 70px; /* Ensures hero is below the fixed header */
    }

    .hero-content {
      max-width: 800px;
      margin: 0 auto;
      animation: fadeInUp 1.2s forwards ease-in-out;
      opacity: 0;
      transform: translateY(20px);
    }

    .hero h1 {
      font-family: 'Garamond', serif;
      font-weight: 700;
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      color: #d4af37; /* Gold accent */
      text-transform: uppercase;
    }

    .hero p {
      font-size: 1.2rem;
      color: #f5f5f5;
      margin-bottom: 0;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    /* Keyframes for a subtle fade-in-up effect */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ----------------------------------------------------------------
       CONTACT SECTION
    ---------------------------------------------------------------- */
    .contact-container {
      max-width: 600px;
      width: 90%;
      margin: 3rem auto 5rem; /* spacing around container */
      background: linear-gradient(135deg, #1f1f1f, #2b2b2b);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      padding: 2rem;
      text-align: center;
      animation: fadeInUp 1.2s forwards ease-in-out;
      opacity: 0;
      transform: translateY(20px);
    }

    .contact-container h2 {
      font-family: 'Garamond', serif;
      font-weight: 700;
      color: #ffffff;
      font-size: 2rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 0.9rem;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #1f1f1f;
      color: #f5f5f5;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: #d4af37; /* Gold highlight on focus */
      outline: none;
    }

    .contact-form button {
      padding: 0.9rem;
      background: #d4af37; /* Gold button */
      border: none;
      color: #111;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.3s ease, transform 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .contact-form button:hover {
      background: #c19e3b; /* Slightly darker gold on hover */
      transform: scale(1.05);
    }

    /* ----------------------------------------------------------------
       POPUP MODAL (Reused from your existing approach)
    ---------------------------------------------------------------- */
    .email-popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .email-popup-content {
      background: linear-gradient(135deg, #282828, #1f1f1f);
      padding: 40px;
      text-align: center;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      animation: fadeInUp 0.8s forwards ease-in-out;
      opacity: 0;
      transform: translateY(20px);
    }

    .email-popup-content h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #ffffff;
      font-family: 'Garamond', serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .email-popup-content p {
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: #f5f5f5;
    }

    .email-popup-content button {
      padding: 10px 20px;
      background: #d4af37;
      border: none;
      color: #111;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 8px;
      transition: background 0.3s ease, transform 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .email-popup-content button:hover {
      background: #c19e3b;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Header & Navigation (reused from shop.html) -->
  <header class="header">
    <nav class="header-nav">
      <img src="TAS Logo Vector IC.svg" alt="TAS Logo" class="logo">
      <div class="nav-links">
        <a href="index.html" class="nav-link">HOME</a>
        <a href="about.html" class="nav-link">ABOUT</a>
        <a href="shop.html" class="nav-link">SHOP</a>
        <a href="InnerCircle.html" class="nav-link">THE INNER CIRCLE</a>
        <a href="contact.html" class="nav-link">CONTACT</a>
      </div>
    </nav>
  </header>

  <!-- Hero Section for a Luxurious Introduction -->
  <section class="hero">
    <div class="hero-content">
      <h1>Contact Support</h1>
      <p>Need assistance? We’re here to help. Let us know how we can make your experience even better.</p>
    </div>
  </section>

  <!-- Contact Form Container -->
  <div class="contact-container">
    <h2>Reach Out to Us</h2>
    <form id="contact-form" class="contact-form">
      <input type="email" id="contact-email" placeholder="Enter your email" required>
      <input type="text" id="contact-name" placeholder="Enter your name" required>
      <textarea id="contact-message" placeholder="Enter your message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <!-- Popup Modal (confirmation) -->
  <div class="email-popup-overlay" id="email-popup">
    <div class="email-popup-content">
      <h2>Thank You for Contacting Support!</h2>
      <p>We will get back to you shortly.</p>
      <button id="resume-button">Resume Browsing</button>
    </div>
  </div>

  <!-- Contact Form Submission Logic (Combining name + message in Column C) -->
  <script>
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('contact-email').value;
      const name = document.getElementById('contact-name').value;
      const message = document.getElementById('contact-message').value;

      if (email && name && message) {
          fetch('https://art-show-signup-rh2gqoobqa-uw.a.run.app/submit-email', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
              },
              // Column A: "Support", B: email, C: "Name: Message"
              body: JSON.stringify({ 
                  listType: 'Support', 
                  email: email, 
                  name: name + ': ' + message 
              })
          })
          .then(response => response.json())
          .then(data => {
              // Show popup modal on success
              document.getElementById('email-popup').style.display = 'flex';
              // Reset form
              document.getElementById('contact-form').reset();
          })
          .catch(error => {
              console.error('Error:', error);
              alert('An error occurred. Please try again.');
          });
      } else {
          alert('Please fill out all fields.');
      }
    });

    // Close popup modal when "Resume Browsing" is clicked
    document.getElementById('resume-button').addEventListener('click', function () {
      document.getElementById('email-popup').style.display = 'none';
    });
  </script>
</body>
</html>
