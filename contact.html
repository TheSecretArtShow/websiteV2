<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE ART SHOW | Contact Support</title>
  <style>
    /* Reused styles from shop.html for header and background */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Helvetica Neue', sans-serif;
    }
    body {
        background: #111111;
        color: #ffffff;
    }
    .header {
        padding: 1rem 5%;
        border-bottom: 1px solid #3a3a3a;
        position: fixed;
        width: 100%;
        background: rgba(45, 45, 45, 0.97) !important;
        backdrop-filter: blur(8px);
        z-index: 100;
    }
    .header-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1400px;
        margin: 0 auto;
    }
    .logo {
        width: 180px;
    }
    .nav-links {
        display: flex;
        gap: 2.8rem;
    }
    .nav-link {
        color: rgba(255, 255, 255, 0.9) !important;
        text-decoration: none;
        font-weight: 300;
        letter-spacing: 2.5px;
        font-size: 0.95rem;
        text-transform: uppercase;
        position: relative;
        padding-bottom: 3px;
        transition: opacity 0.4s ease;
    }
    .nav-link::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 0.5px;
        background: rgba(255, 255, 255, 0.9);
        transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .nav-link:hover::after {
        width: 100%;
    }
    .nav-link[href="contact.html"] {
        font-weight: 400;
    }
    .nav-link[href="contact.html"]::after {
        width: 100%;
    }
    
    /* Contact form container */
    .contact-container {
        padding: 150px 5% 50px; /* Extra top padding to account for the fixed header */
        max-width: 600px;
        margin: 0 auto;
    }
    .contact-container h2 {
        text-align: center;
        margin-bottom: 20px;
        font-family: 'Garamond', serif;
        font-weight: 700;
    }
    
    /* Contact form styling (adapted from the InnerCircle email form) */
    .contact-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .contact-form input,
    .contact-form textarea {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #444;
        background-color: #1f1f1f;
        color: #f5f5f5;
        font-size: 1rem;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
        border-color: #ff6b6b;
        outline: none;
    }
    .contact-form button {
        padding: 12px;
        background: linear-gradient(135deg, #ff6b6b, #ff3b3b);
        border: none;
        color: #f5f5f5;
        cursor: pointer;
        font-size: 1rem;
        border-radius: 8px;
        transition: background 0.3s ease, transform 0.3s ease;
    }
    .contact-form button:hover {
        background: linear-gradient(135deg, #ff3b3b, #ff1a1a);
        transform: scale(1.05);
    }
    
    /* Popup modal styling (adapted from InnerCircle) */
    .email-popup-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .email-popup-content {
        background: linear-gradient(135deg, #282828, #1f1f1f);
        padding: 40px;
        text-align: center;
        border-radius: 16px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    .email-popup-content h2 {
        font-size: 2rem;
        margin-bottom: 20px;
    }
    .email-popup-content p {
        font-size: 1.1rem;
        margin-bottom: 20px;
    }
    .email-popup-content button {
        padding: 10px 20px;
        background: linear-gradient(135deg, #ff6b6b, #ff3b3b);
        border: none;
        color: #f5f5f5;
        cursor: pointer;
        font-size: 1rem;
        border-radius: 8px;
        transition: background 0.3s ease, transform 0.3s ease;
    }
    .email-popup-content button:hover {
        background: linear-gradient(135deg, #ff3b3b, #ff1a1a);
        transform: scale(1.05);
    }
  </style>
</head>
<body>
  <!-- Header & Navigation (reused from shop.html) -->
  <header class="header">
      <nav class="header-nav">
          <img src="TAS Logo Vector IC.svg" alt="TAS Logo" class="logo">
          <div class="nav-links">
              <a href="index.html" class="nav-link">HOME</a>
              <a href="about.html" class="nav-link">ABOUT</a>
              <a href="shop.html" class="nav-link">SHOP</a>
              <a href="InnerCircle.html" class="nav-link">THE INNER CIRCLE</a>
              <a href="contact.html" class="nav-link">CONTACT</a>
          </div>
      </nav>
  </header>
  
  <!-- Contact Form Section -->
  <div class="contact-container">
      <h2>Contact Support</h2>
      <form id="contact-form" class="contact-form">
          <input type="email" id="contact-email" placeholder="Enter your email" required>
          <input type="text" id="contact-name" placeholder="Enter your name" required>
          <textarea id="contact-message" placeholder="Enter your message" rows="5" required></textarea>
          <button type="submit">Send Message</button>
      </form>
  </div>
  
  <!-- Popup Modal -->
  <div class="email-popup-overlay" id="email-popup">
      <div class="email-popup-content">
          <h2>Thank You for Contacting Support!</h2>
          <p>We will get back to you shortly.</p>
          <button id="resume-button">Resume Browsing</button>
      </div>
  </div>
  
  <script>
    // Contact form submission logic adapted from the InnerCircle email signup
    document.getElementById('contact-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('contact-email').value;
        const name = document.getElementById('contact-name').value;
        const message = document.getElementById('contact-message').value;
    
        if (email && name && message) {
            fetch('https://art-show-signup-rh2gqoobqa-uw.a.run.app/submit-email', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                // Payload: "Support" in column A, email in column B, name in column C, message in column D
                body: JSON.stringify({ 
                    listType: 'Support', 
                    email: email, 
                    name: name, 
                    message: message 
                })
            })
            .then(response => response.json())
            .then(data => {
                // Show popup modal on success
                document.getElementById('email-popup').style.display = 'flex';
                // Optionally reset the form
                document.getElementById('contact-form').reset();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            });
        } else {
            alert('Please fill out all fields.');
        }
    });
    
    // Close popup modal when the resume button is clicked
    document.getElementById('resume-button').addEventListener('click', function () {
        document.getElementById('email-popup').style.display = 'none';
    });
  </script>
</body>
</html>
