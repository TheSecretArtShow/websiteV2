<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARTSHOW | Contact Support</title>
  <style>
    /* ----------------------------------------------------------------
       RESET & BASE STYLES
    ---------------------------------------------------------------- */
    html, body {
      margin: 0;
      padding: 0;
    }
    * {
      box-sizing: border-box;
      /* Use the same font as "SOLD OUT" in shop.html */
      font-family: 'Helvetica Neue', sans-serif;
      font-weight: 300; /* Matches the "SOLD OUT" style */
    }

    body {
      background: #111111; /* Dark background */
      color: #ffffff;      /* White text */
      overflow-x: hidden;  /* No horizontal scroll */
    }

    /* ----------------------------------------------------------------
       HEADER & NAV
       Fixed at the very top, flush with the page edge
    ---------------------------------------------------------------- */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1rem 5%;
      border-bottom: 1px solid #3a3a3a;
      background: rgba(45, 45, 45, 0.97) !important;
      backdrop-filter: blur(8px);
      z-index: 100;
    }
    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1400px;
      margin: 0 auto;
    }
    .logo {
      width: 180px;
    }
    .nav-links {
      display: flex;
      gap: 2.8rem;
    }
    .nav-link {
      color: rgba(255, 255, 255, 0.9) !important;
      text-decoration: none;
      letter-spacing: 3px; /* Matches "SOLD OUT" letter-spacing */
      font-size: 0.95rem;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 3px;
      transition: opacity 0.4s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0.5px;
      background: rgba(255, 255, 255, 0.9);
      transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .nav-link:hover::after {
      width: 100%;
    }
    .nav-link[href="contact.html"] {
      font-weight: 400; /* highlight CONTACT page */
    }
    .nav-link[href="contact.html"]::after {
      width: 100%;
    }

    /* ----------------------------------------------------------------
       HERO SECTION WITH VIDEO BACKGROUND
    ---------------------------------------------------------------- */
    .hero {
      position: relative;
      margin-top: 70px; /* So hero is fully visible below the fixed header */
      min-height: 70vh; /* Ensures a nice tall section */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Video behind everything else */
    .hero-video-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }
    .hero-video-background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Dark overlay to make text more readable */
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(17, 17, 17, 0.55); /* Slight dark overlay */
      z-index: 0;
    }

    .hero-content {
      position: relative; /* Above the overlay and video */
      z-index: 1;
      text-align: center;
      animation: fadeInUp 1.2s forwards ease-in-out;
      opacity: 0;
      transform: translateY(20px);
    }

    /* Hero heading matches "SOLD OUT" style */
    .hero-content h1 {
      letter-spacing: 3px; /* same spacing as "SOLD OUT" */
      font-size: 2.5rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
      color: #d4af37; /* Gold accent */
    }
    .hero-content p {
      font-size: 1.2rem;
      color: #f5f5f5;
      margin-bottom: 0;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ----------------------------------------------------------------
       CONTACT SECTION
    ---------------------------------------------------------------- */
    .contact-container {
      max-width: 600px;
      width: 90%;
      margin: 3rem auto 5rem; /* spacing around container */
      background: linear-gradient(135deg, #1f1f1f, #2b2b2b);
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      padding: 2rem;
      text-align: center;
      animation: fadeInUp 1.2s forwards ease-in-out;
      opacity: 0;
      transform: translateY(20px);
    }

    .contact-container h2 {
      letter-spacing: 3px; /* Matches "SOLD OUT" spacing */
      text-transform: uppercase;
      font-size: 1.6rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 0.9rem;
      border-radius: 8px;
      border: 1px solid #444;
      background-color: #1f1f1f;
      color: #f5f5f5;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: #d4af37; /* Gold highlight on focus */
      outline: none;
    }
    .contact-form button {
      padding: 0.9rem;
      background: #d4af37; /* Gold button */
      border: none;
      color: #111;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.3s ease, transform 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .contact-form button:hover {
      background: #c19e3b;
      transform: scale(1.05);
    }

    /* ----------------------------------------------------------------
       POPUP MODAL (confirmation)
    ---------------------------------------------------------------- */
    .email-popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .email-popup-content {
      background: linear-gradient(135deg, #282828, #1f1f1f);
      padding: 40px;
      text-align: center;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      animation: fadeInUp 0.8s forwards ease-in-out;
      opacity: 0;
      transform: translateY(20px);
    }
    .email-popup-content h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 3px; /* match "SOLD OUT" spacing */
      font-weight: 300;
    }
    .email-popup-content p {
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: #f5f5f5;
    }
    .email-popup-content button {
      padding: 10px 20px;
      background: #d4af37;
      border: none;
      color: #111;
      cursor: pointer;
      font-size: 1rem;
      border-radius: 8px;
      transition: background 0.3s ease, transform 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .email-popup-content button:hover {
      background: #c19e3b;
      transform: scale(1.05);
    }
    /* Dropdown Menu Styles */
/* -----------------------------
   DROPDOWN FOR SHOP LINK
----------------------------- */
.dropdown-container {
  position: relative;
  display: inline-block; /* Keeps SHOP and dropdown inline in the nav */
}

/* Keep the underline animation from .nav-link::after.
   Shift SHOP up slightly on hover to create space for sublinks. */
.dropdown-container:hover > .nav-link {
  transform: translateY(-5px);
}

/* The dropdown sublinks remain hidden until hover. */
/* Dropdown Container for SHOP */
.dropdown-container {
  position: relative;
  display: inline-block; /* Keep SHOP and dropdown inline in the nav */
}

/* Make the nav-link an inline-block so it can shift on hover */
.dropdown-container .nav-link {
  display: inline-block;
  transition: transform 0.3s ease; /* Smooth shift animation */
}

/* SHIFT "SHOP" up on hover to create space */
.dropdown-container:hover > .nav-link {
  transform: translateY(-5px);
}

/* The dropdown sublinks remain hidden until hover */
.dropdown {
  display: none;
  position: absolute;
  left: 0;
  top: 100%;
  transform: translateY(3px); /* Slight offset so sublinks appear just below SHOP */
  
  /* Transparent bounding box so you can hover between SHOP and sublinks */
  background: transparent; 
  pointer-events: none;
  
  /* A little vertical padding so there's no gap the mouse can "fall through" */
  padding: 6px 0;
}

/* Show the dropdown & enable pointer events on container hover */
.dropdown-container:hover .dropdown {
  display: block;
  pointer-events: auto;
}

/* Sublink styling: small text, uppercase, minimal spacing */
.dropdown-item {
  display: block;
  font-size: 0.7rem;      /* 1pt smaller than before (adjust as you like) */
  letter-spacing: 2px;    /* Slightly less than main nav’s 3px */
  text-transform: uppercase;
  text-decoration: none;
  color: rgba(255, 255, 255, 0.9);
  margin: 0.15rem 0;      /* Vertical spacing between items */
  transition: color 0.3s ease;
}

/* Hover effect on sublinks */
.dropdown-item:hover {
  color: rgba(255, 255, 255, 1);
}

  </style>
</head>
<body>
  <!-- Header & Navigation -->
<header class="header">
  <nav class="header-nav">
    <img src="TAS Logo Vector IC.svg" alt="TAS Logo" class="logo">
    <div class="nav-links">
      <a href="index.html" class="nav-link">HOME</a>
      <a href="about.html" class="nav-link">ABOUT</a>

      <!-- Dropdown Container for SHOP -->
      <div class="dropdown-container">
  <a href="shop.html" class="nav-link">SHOP</a>
  <div class="dropdown">
    <a href="shop.html" class="dropdown-item">ALL PIECES</a>
    <a href="collections.html" class="dropdown-item">COLLECTIONS</a>
  </div>
</div>


      <a href="InnerCircle.html" class="nav-link">THE INNER CIRCLE</a>
      <a href="contact.html" class="nav-link">CONTACT</a>
    </div>
  </nav>
</header>


  <!-- Hero Section with Video Background -->
  <section class="hero">
    <div class="hero-video-background">
      <video autoplay loop muted playsinline>
        <source src="copy_CE9B24DC-1B21-40BA-90FF-AEA63EAF04EA.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="hero-content">
      <h1>CONTACT US</h1>
      <p>Got questions? Want to collab or commission a custom piece? We're happy to hear how we can make your experience even better.</p>
    </div>
  </section>

  <!-- Contact Form Container -->
  <div class="contact-container">
    <h2>Reach Out To Us</h2>
    <form id="contact-form" class="contact-form">
      <input type="email" id="contact-email" placeholder="Enter your email" required>
      <input type="text" id="contact-name" placeholder="Enter your name" required>
      <textarea id="contact-message" placeholder="Enter your message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <!-- Popup Modal (confirmation) -->
  <div class="email-popup-overlay" id="email-popup">
    <div class="email-popup-content">
      <h2>Thank You!</h2>
      <p>We will get back to you shortly.</p>
      <button id="resume-button">Resume Browsing</button>
    </div>
  </div>

  <!-- Contact Form Submission Logic -->
  <script>
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('contact-email').value;
      const name = document.getElementById('contact-name').value;
      const message = document.getElementById('contact-message').value;

      if (email && name && message) {
          fetch('https://art-show-signup-rh2gqoobqa-uw.a.run.app/submit-email', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
              },
              // Column A: "Support", B: email, C: "Name: Message"
              body: JSON.stringify({ 
                  listType: 'Support', 
                  email: email, 
                  name: name + ': ' + message 
              })
          })
          .then(response => response.json())
          .then(data => {
              // Show popup modal on success
              document.getElementById('email-popup').style.display = 'flex';
              // Reset form
              document.getElementById('contact-form').reset();
          })
          .catch(error => {
              console.error('Error:', error);
              alert('An error occurred. Please try again.');
          });
      } else {
          alert('Please fill out all fields.');
      }
    });

    // Close popup modal when "Resume Browsing" is clicked
    document.getElementById('resume-button').addEventListener('click', function () {
      document.getElementById('email-popup').style.display = 'none';
    });
  </script>
</body>
</html>
