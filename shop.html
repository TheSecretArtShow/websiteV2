<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTSHOW | Shop</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', sans-serif;
        }

        body {
            background: #111111;
            color: #ffffff;
        }

        /* Header Styles */
        .header {
            padding: 1rem 5%;
            border-bottom: 1px solid #3a3a3a;
            position: fixed;
            width: 100%;
            background: rgba(45, 45, 45, 0.97) !important;
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            width: 180px;
        }

        .nav-links {
            display: flex;
            gap: 2.8rem;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            text-decoration: none;
            font-weight: 300;
            letter-spacing: 2.5px;
            font-size: 0.95rem;
            text-transform: uppercase;
            position: relative;
            padding-bottom: 3px;
            transition: opacity 0.4s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0.5px;
            background: rgba(255, 255, 255, 0.9);
            transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-link[href="shop.html"] {
            font-weight: 400;
        }

        .nav-link[href="shop.html"]::after {
            width: 100%;
        }

        /* Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4rem;
            padding: 10rem 5% 5rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .product-card {
            position: relative;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: auto;
            aspect-ratio: 3/4;
            background: #fff;
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .product-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.6s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .product-card:hover .product-overlay {
            opacity: 1;
        }

        .product-card:hover .product-image {
            transform: scale(1.03);
        }

        .sold-out {
            color: white;
            font-weight: 300;
            letter-spacing: 3px;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            transform: translateY(20px);
            transition: transform 0.6s ease;
        }

        .view-details {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 0.8rem 2rem;
            cursor: pointer;
            font-weight: 300;
            letter-spacing: 2px;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .product-card:hover .sold-out,
        .product-card:hover .view-details {
            transform: translateY(0);
        }

        .product-info {
            padding: 1.5rem 0;
            text-align: center;
        }

        .product-title {
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .product-price {
            font-weight: 300;
            color: #ffffff;
        }

        /* Full-Screen Popup Overlay */
        #shop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0);
            transition: background 0.5s ease;
            z-index: 300;
            display: none;
            overflow: hidden;
        }

        .overlay-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .overlay-form {
            margin-top: 20px;
        }

        .overlay-form button {
            margin: 5px;
            padding: 0.8rem 1.2rem;
            background: transparent;
            border: 1px solid #fff;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .overlay-form button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Popup Overlay -->
    <div id="shop-overlay">
        <div class="overlay-content">
            <div class="overlay-form">
                <button id="inner-circle-button">THE INNER CIRCLE</button>
                <button id="resume-button">RESUME BROWSING</button>
            </div>
        </div>
    </div>

    <script>
        // Get the overlay and its content container
        const shopOverlay = document.getElementById('shop-overlay');
        const overlayContent = shopOverlay.querySelector('.overlay-content');

        // Attach click event to each "VIEW DETAILS" button
        document.querySelectorAll('.view-details').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                // Display the overlay
                shopOverlay.style.display = 'block';
                // Fade in the background
                setTimeout(() => {
                    shopOverlay.style.background = 'rgba(0,0,0,0.9)';
                }, 10);
                // Fade in the overlay content
                setTimeout(() => {
                    overlayContent.style.opacity = '1';
                }, 500);
            });
        });

        // "THE INNER CIRCLE" button redirects to InnerCircle.html
        document.getElementById('inner-circle-button').addEventListener('click', () => {
            window.location.href = 'InnerCircle.html';
        });

        // "RESUME BROWSING" button closes the overlay
        document.getElementById('resume-button').addEventListener('click', () => {
            overlayContent.style.opacity = '0';
            shopOverlay.style.background = 'rgba(0,0,0,0)';
            setTimeout(() => {
                shopOverlay.style.display = 'none';
            }, 500);
        });
    </script>
